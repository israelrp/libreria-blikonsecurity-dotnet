<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Países</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .button-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-weight: bold;
            margin: 20px 0;
        }

        .error {
            background-color: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            display: none;
        }

        .error.show {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table thead {
            background-color: #667eea;
            color: white;
        }

        table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        table td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }

        table tbody tr:hover {
            background-color: #f5f5f5;
        }

        table tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .no-data {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Consulta de Países</h1>
        
        <div class="button-container">
            <button id="consultarBtn" onclick="consultarPaises()">Consultar Países</button>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Autenticando y cargando datos...</p>
        </div>

        <div id="error" class="error"></div>

        <div id="tableContainer"></div>
    </div>

    <script>
        async function consultarPaises() {
            const btn = document.getElementById('consultarBtn');
            const loading = document.getElementById('loading');
            const errorDiv = document.getElementById('error');
            const tableContainer = document.getElementById('tableContainer');

            // Limpiar errores
            errorDiv.classList.remove('show');
            errorDiv.textContent = '';

            // Mostrar loading y deshabilitar botón
            loading.style.display = 'block';
            btn.disabled = true;
            tableContainer.innerHTML = '';

            try {
                // Hacer la solicitud al endpoint backend
                const response = await fetch('/api/countries');
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `Error ${response.status}`);
                }

                const countries = await response.json();

                // Ocultar loading
                loading.style.display = 'none';

                if (!countries || countries.length === 0) {
                    tableContainer.innerHTML = '<div class="no-data">No se encontraron países</div>';
                } else {
                    // Renderizar tabla
                    const html = generarTabla(countries);
                    tableContainer.innerHTML = html;
                }
            } catch (error) {
                loading.style.display = 'none';
                errorDiv.textContent = '❌ Error: ' + error.message;
                errorDiv.classList.add('show');
            } finally {
                btn.disabled = false;
            }
        }

        function generarTabla(countries) {
            let html = '<table><thead><tr><th>ID</th><th>Nombre</th><th>Código</th></tr></thead><tbody>';
            
            countries.forEach(country => {
                html += `<tr>
                    <td>${country.id}</td>
                    <td>${country.name}</td>
                    <td>${country.code}</td>
                </tr>`;
            });

            html += '</tbody></table>';
            return html;
        }
    </script>
</body>
</html>
